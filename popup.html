<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoFill Extension</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 20, 40, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.2),
                        0 0 60px rgba(0, 255, 150, 0.1);
            border: 1px solid rgba(0, 255, 200, 0.3);
        }

        h1 {
            color: #00ffcc;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.6),
                         0 0 20px rgba(0, 255, 150, 0.4);
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #00ffcc;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.4);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 200, 0.3);
            border-radius: 8px;
            color: #00ffcc;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        input::placeholder {
            color: rgba(0, 255, 200, 0.4);
        }

        input:focus {
            outline: none;
            border-color: #00ffcc;
            background: rgba(0, 255, 200, 0.05);
            box-shadow: 0 0 15px rgba(0, 255, 200, 0.3),
                        inset 0 0 10px rgba(0, 255, 200, 0.05);
        }

        input:hover {
            border-color: rgba(0, 255, 200, 0.6);
            box-shadow: 0 0 10px rgba(0, 255, 200, 0.2);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        }

        .btn-save {
            background: linear-gradient(135deg, #00ffcc 0%, #00ff99 100%);
            color: #0a0e27;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.4),
                        0 0 40px rgba(0, 255, 150, 0.2);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.6),
                        0 0 60px rgba(0, 255, 150, 0.3);
        }

        .btn-save:active {
            transform: translateY(0);
        }

        .btn-autofill {
            background: linear-gradient(135deg, #ff006e 0%, #ff1493 100%);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.4),
                        0 0 40px rgba(255, 20, 147, 0.2);
        }

        .btn-autofill:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.6),
                        0 0 60px rgba(255, 20, 147, 0.3);
        }

        .btn-autofill:active {
            transform: translateY(0);
        }

        .status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .status-message.success {
            background: rgba(0, 255, 200, 0.15);
            color: #00ffcc;
            border: 1px solid rgba(0, 255, 200, 0.3);
            display: block;
        }

        .status-message.error {
            background: rgba(255, 0, 110, 0.15);
            color: #ff006e;
            border: 1px solid rgba(255, 0, 110, 0.3);
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-icon {
            position: relative;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px rgba(0, 255, 200, 0.05) inset !important;
            -webkit-text-fill-color: #00ffcc !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ AutoFill</h1>
        
        <form id="autofillForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input 
                    type="text" 
                    id="address" 
                    name="address" 
                    placeholder="Enter your street address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input 
                    type="text" 
                    id="city" 
                    name="city" 
                    placeholder="Enter your city"
                    required
                >
            </div>

            <div class="button-group">
                <button type="submit" class="btn-save">💾 Save</button>
                <button type="button" id="autofillBtn" class="btn-autofill">✨ AutoFill</button>
            </div>

            <div id="statusMessage" class="status-message"></div>
        </form>
    </div>

    <script src="popup.js"></script>
</body>
</html>
